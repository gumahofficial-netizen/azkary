name: muslim_app
description: "تطبيق مسلم الإسلامي المتكامل والاحترافي"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  path_provider: ^2.1.4
  audioplayers: ^6.0.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  sensors_plus: ^5.0.1
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.1
  adhan: ^2.0.0
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran/data/
    - assets/adhkar/
    - assets/stories/
    - assets/duas/
    - assets/radio/
    - assets/images/
    - assets/audio/
